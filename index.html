<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Tool — أدوات الصور</title>
  <style>
    :root {
      --bg: #0c1020;
      --panel: #151b2e;
      --panel2: #1c243b;
      --text: #f3f5ff;
      --muted: #aab3cc;
      --accent: #8b7cff;
      --accent2: #42d8c2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 10% 0%, #292452 0, transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, Tahoma, sans-serif;
    }
    header {
      max-width: 1100px;
      margin: auto;
      padding: 28px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand { font-size: 25px; font-weight: 800; letter-spacing: -.5px; }
    .brand span { color: var(--accent2); }
    header p { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 20px; }
    .sidebar, .workspace {
      background: rgba(21,27,46,.92);
      border: 1px solid #29314b;
      border-radius: 18px;
      padding: 16px;
    }
    .tool-btn {
      width: 100%;
      border: 0;
      color: var(--muted);
      background: transparent;
      text-align: right;
      padding: 13px 12px;
      border-radius: 11px;
      cursor: pointer;
      font: inherit;
      margin: 3px 0;
    }
    .tool-btn:hover, .tool-btn.active { background: var(--panel2); color: white; }
    .tool-btn.active { box-shadow: inset -3px 0 var(--accent); }
    .workspace h1 { margin: 2px 0 5px; font-size: 23px; }
    .description { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .drop {
      border: 1px dashed #596485;
      background: #11172a;
      border-radius: 15px;
      min-height: 175px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 22px;
      color: var(--muted);
      cursor: pointer;
    }
    .drop strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
    input[type=file] { display: none; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 17px; align-items: end; }
    .field { display: grid; gap: 7px; color: var(--muted); font-size: 13px; }
    input[type=text], select, input[type=range] {
      border: 1px solid #343e5d;
      background: #101629;
      color: white;
      border-radius: 9px;
      padding: 10px;
      font: inherit;
    }
    input[type=text] { min-width: 190px; }
    .btn {
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.secondary { background: #29324e; }
    .btn:disabled { opacity: .5; cursor: wait; }
    .preview-wrap { margin-top: 18px; display: none; }
    .preview-wrap img {
      max-width: 100%;
      max-height: 360px;
      display: block;
      margin: 0 auto;
      border-radius: 10px;
      background-color: #f1f1f1;
      background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
      background-size: 18px 18px;
      background-position: 0 0,0 9px,9px -9px,-9px 0;
    }
    #status { color: var(--accent2); min-height: 24px; margin-top: 14px; font-size: 14px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 16px; }
    @media(max-width:700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
      .tool-btn { font-size: 13px; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">pixel <span>Tool</span></div>
      <p>أدوات صور سهلة وسريعة — تتم المعالجة داخل متصفحك</p>
    </div>
  </header>

  <main>
    <div class="layout">
      <nav class="sidebar" aria-label="الأدوات">
        <button class="tool-btn active" data-tool="remove">إزالة الخلفية</button>
        <button class="tool-btn" data-tool="compress">ضغط حجم الصورة</button>
        <button class="tool-btn" data-tool="convert">تحويل صيغة الصورة</button>
        <button class="tool-btn" data-tool="crop">قص مربع أو دائري</button>
        <button class="tool-btn" data-tool="watermark">إضافة علامة مائية</button>
      </nav>

      <section class="workspace">
        <h1 id="toolTitle">إزالة الخلفية</h1>
        <p class="description" id="toolDescription">ارفع صورة لإزالة خلفيتها وتنزيلها بصيغة PNG.</p>

        <label class="drop" for="fileInput">
          <span><strong>اضغط لاختيار صورة</strong>أو اسحبها وأفلتها هنا<br>PNG، JPG، WebP</span>
        </label>
        <input id="fileInput" type="file" accept="image/*">

        <div id="controls" class="controls"></div>
        <div id="status" role="status"></div>

        <div class="preview-wrap" id="previewWrap">
          <img id="preview" alt="معاينة الصورة">
        </div>

        <p class="note">
          ملاحظة: لا ترفع ملفات حساسة إلى مواقع خارجية. إزالة الخلفية هنا تعتمد على مكتبة خارجية تُحمّل عند الطلب.
        </p>
      </section>
    </div>
  </main>

<script type="module">
  const $ = (s) => document.querySelector(s);
  const fileInput = $("#fileInput");
  const controls = $("#controls");
  const status = $("#status");
  const preview = $("#preview");
  const previewWrap = $("#previewWrap");

  let selectedFile = null;
  let currentTool = "remove";
  let previewUrl = null;

  const toolInfo = {
    remove: ["إزالة الخلفية", "ارفع صورة لإزالة خلفيتها وتنزيلها بصيغة PNG."],
    compress: ["ضغط حجم الصورة", "قلّل حجم الصورة بتعديل الجودة أو الأبعاد."],
    convert: ["تحويل صيغة الصورة", "حوّل الصورة إلى PNG أو JPEG أو WebP."],
    crop: ["قص الصورة", "أنشئ نسخة مربعة أو دائرية من الصورة."],
    watermark: ["إضافة علامة مائية", "أضف نصًا فوق الصورة ثم نزّلها."]
  };

  document.querySelectorAll(".tool-btn").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelector(".tool-btn.active")?.classList.remove("active");
      button.classList.add("active");
      currentTool = button.dataset.tool;
      $("#toolTitle").textContent = toolInfo[currentTool][0];
      $("#toolDescription").textContent = toolInfo[currentTool][1];
      status.textContent = "";
      renderControls();
    });
  });

  fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0] || null;
    showPreview();
    status.textContent = selectedFile ? `تم اختيار: ${selectedFile.name}` : "";
  });

  const drop = document.querySelector(".drop");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.style.borderColor = "#8b7cff"; });
  drop.addEventListener("dragleave", () => drop.style.borderColor = "");
  drop.addEventListener("drop", e => {
    e.preventDefault();
    drop.style.borderColor = "";
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith("image/")) {
      selectedFile = file;
      showPreview();
      status.textContent = `تم اختيار: ${file.name}`;
    } else status.textContent = "الرجاء اختيار ملف صورة.";
  });

  function renderControls() {
    const common = `<button class="btn" id="runBtn">تنفيذ وتنزيل</button>`;
    if (currentTool === "compress") {
      controls.innerHTML = `
        <label class="field">الجودة: <span id="qualityText">75%</span>
          <input id="quality" type="range" min="10" max="100" value="75">
        </label>
        <label class="field">أقصى عرض (بكسل)
          <input id="maxWidth" type="text" inputmode="numeric" value="1600">
        </label>${common}`;
      $("#quality").oninput = e => $("#qualityText").textContent = e.target.value + "%";
    } else if (currentTool === "convert") {
      controls.innerHTML = `
        <label class="field">الصيغة
          <select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select>
        </label>${common}`;
    } else if (currentTool === "crop") {
      controls.innerHTML = `
        <label class="field">شكل القص
          <select id="cropShape"><option value="square">مربع</option><option value="circle">دائري</option></select>
        </label>${common}`;
    } else if (currentTool === "watermark") {
      controls.innerHTML = `
        <label class="field">نص العلامة المائية
          <input id="watermarkText" type="text" placeholder="مثال: Pixel Tool">
        </label>
        <label class="field">الحجم
          <select id="watermarkSize"><option value="24">صغير</option><option value="40" selected>متوسط</option><option value="64">كبير</option></select>
        </label>${common}`;
    } else {
      controls.innerHTML = common;
    }
    $("#runBtn").onclick = runTool;
  }
  renderControls();

  function showPreview() {
    if (!selectedFile) return;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(selectedFile);
    preview.src = previewUrl;
    previewWrap.style.display = "block";
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("تعذّر قراءة الصورة."));
      img.src = URL.createObjectURL(file);
    });
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function canvasBlob(canvas, type = "image/png", quality = .9) {
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));
  }

  async function runTool() {
    if (!selectedFile) { status.textContent = "اختر صورة أولًا."; return; }
    const button = $("#runBtn");
    button.disabled = true;
    status.textContent = "جارٍ تجهيز الصورة…";

    try {
      if (currentTool === "remove") {
        // مكتبة إزالة الخلفية تعمل في المتصفح وتحمّل نموذجها عند أول استخدام.
        const { removeBackground } = await import("https://esm.sh/@imgly/background-removal");
        status.textContent = "جارٍ إزالة الخلفية… قد يستغرق ذلك بعض الوقت في أول مرة.";
        const result = await removeBackground(selectedFile);
        downloadBlob(result, "pixel-tool-background-removed.png");
        status.textContent = "تمت إزالة الخلفية وتنزيل الصورة.";
        return;
      }

      const img = await loadImage(selectedFile);
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      let type = "image/png";
      let quality = .9;

      if (currentTool === "compress") {
        const maxWidth = Math.max(1, Number($("#maxWidth").value) || 1600);
        const scale = Math.min(1, maxWidth / img.width);
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        type = "image/jpeg";
        quality = Number($("#quality").value) / 100;
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      } else if (currentTool === "convert") {
        type = $("#format").value;
        canvas.width = img.width;
        canvas.height = img.height;
        if (type === "image/jpeg") {
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0);
      } else if (currentTool === "crop") {
        const size = Math.min(img.width, img.height);
        canvas.width = size;
        canvas.height = size;
        if ($("#cropShape").value === "circle") {
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.clip();
        }
        ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, size, size);
      } else if (currentTool === "watermark") {
        const text = $("#watermarkText").value.trim();
        if (!text) throw new Error("اكتب نص العلامة المائية أولًا.");
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const fontSize = Number($("#watermarkSize").value);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.lineWidth = Math.max(2, fontSize / 12);
        ctx.strokeStyle = "rgba(0,0,0,.55)";
        ctx.fillStyle = "rgba(255,255,255,.85)";
        const x = 20, y = canvas.height - 20;
        ctx.strokeText(text, x, y);
        ctx.fillText(text, x, y);
      }

      const blob = await canvasBlob(canvas, type, quality);
      if (!blob) throw new Error("تعذّر إنشاء الصورة الناتجة.");
      const ext = type.split("/")[1].replace("jpeg", "jpg");
      downloadBlob(blob, `pixel-tool.${ext}`);
      status.textContent = `تم بنجاح. الحجم الناتج: ${(blob.size / 1024).toFixed(1)} كيلوبايت.`;
    } catch (error) {
      status.textContent = error.message || "حدث خطأ أثناء معالجة الصورة.";
    } finally {
      button.disabled = false;
    }
  }
</script>
</body>
</html>
