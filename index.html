<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Tools - استوديو الصور الذكي</title>
    <meta name="description" content="مجموعة أدوات متكاملة لمعالجة الصور محلياً داخل المتصفح: إزالة الخلفية، ضغط الحجم، تحويل الصيغ، والقص." />
    
    <!-- كود إثبات ملكية Google Search Console -->
    <meta name="google-site-verification" content="Md2tc493Laa5qpvwHf5J_AsHgpDsAb6NYVPiDnurBbA" />

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-black text-xl shadow-lg shadow-indigo-500/30">PT</div>
                <span class="text-xl font-black tracking-wide bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">Pixel Tools</span>
            </div>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">معالجة فورية وآمنة 100%</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full space-y-8">
        <div class="text-center space-y-3">
            <h1 class="text-3xl sm:text-4xl font-black tracking-tight">اختر الأداة أولاً للبدء</h1>
            <p class="text-slate-400 text-sm">اضغط على أي أداة أدناه ثم اختر الصورة لتطبيق التعديل عليها مباشرة</p>
        </div>

        <!-- Hidden Global File Input -->
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

        <!-- Step 1: Select Tool Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <button onclick="selectTool('png')" class="bg-slate-900/90 hover:bg-indigo-600/20 border border-slate-800 hover:border-indigo-500 p-5 rounded-3xl text-center transition-all group">
                <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🔄</div>
                <div class="text-sm font-bold text-slate-200">تحويل إلى PNG</div>
                <div class="text-xs text-slate-500 mt-1">حفظ بجودة عالية</div>
            </button>
            <button onclick="selectTool('jpg')" class="bg-slate-900/90 hover:bg-indigo-600/20 border border-slate-800 hover:border-indigo-500 p-5 rounded-3xl text-center transition-all group">
                <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🖼️</div>
                <div class="text-sm font-bold text-slate-200">تحويل إلى JPG</div>
                <div class="text-xs text-slate-500 mt-1">صيغة قياسية خفيفة</div>
            </button>
            <button onclick="selectTool('resize')" class="bg-slate-900/90 hover:bg-indigo-600/20 border border-slate-800 hover:border-indigo-500 p-5 rounded-3xl text-center transition-all group">
                <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">📦</div>
                <div class="text-sm font-bold text-slate-200">ضغط الحجم (50%)</div>
                <div class="text-xs text-slate-500 mt-1">تنسيق مساحة التخزين</div>
            </button>
            <button onclick="selectTool('grayscale')" class="bg-slate-900/90 hover:bg-indigo-600/20 border border-slate-800 hover:border-indigo-500 p-5 rounded-3xl text-center transition-all group">
                <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🎨</div>
                <div class="text-sm font-bold text-slate-200">أبيض وأسود</div>
                <div class="text-xs text-slate-500 mt-1">تطبيق فلتر كلاسيكي</div>
            </button>
        </div>

        <!-- Step 2: Workspace Result (Shows after uploading image) -->
        <div id="editorSection" class="hidden space-y-6 pt-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/60 p-6 border border-slate-800 rounded-3xl">
                <div class="space-y-2 text-center">
                    <span class="text-xs text-slate-400 font-bold">الصورة الأصلية</span>
                    <div class="bg-slate-950 p-2 rounded-2xl border border-slate-800 h-64 flex items-center justify-center overflow-hidden">
                        <img id="originalPreview" class="max-h-full max-w-full object-contain rounded-xl" />
                    </div>
                </div>
                <div class="space-y-2 text-center">
                    <span class="text-xs text-indigo-400 font-bold">النتيجة المعدلة</span>
                    <div class="bg-slate-950 p-2 rounded-2xl border border-slate-800 h-64 flex items-center justify-center overflow-hidden">
                        <canvas id="outputCanvas" class="max-h-full max-w-full object-contain rounded-xl"></canvas>
                    </div>
                </div>
            </div>

            <!-- Action Options -->
            <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
                <button onclick="document.getElementById('imageInput').click()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs px-5 py-3 rounded-2xl transition-all">اختر صورة أخرى 🔄</button>
                <button id="downloadBtn" onclick="downloadResult()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm px-8 py-3 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all">تحميل الصورة المعدلة ⬇️</button>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-sm text-slate-500">
        <p>© 2026 Pixel Tools. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        let currentImage = new Image();
        let selectedAction = '';

        function selectTool(toolType) {
            selectedAction = toolType;
            document.getElementById('imageInput').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage.src = e.target.result;
                currentImage.onload = function() {
                    document.getElementById('originalPreview').src = e.target.result;
                    document.getElementById('editorSection').classList.remove('hidden');
                    applySelectedTool();
                }
            }
            reader.readAsDataURL(file);
        }

        function applySelectedTool() {
            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');

            if (selectedAction === 'resize') {
                canvas.width = currentImage.width * 0.5;
                canvas.height = currentImage.height * 0.5;
                ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            } else {
                canvas.width = currentImage.width;
                canvas.height = currentImage.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(currentImage, 0, 0);

                if (selectedAction === 'grayscale') {
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        data[i] = avg;
                        data[i + 1] = avg;
                        data[i + 2] = avg;
                    }
                    ctx.putImageData(imgData, 0, 0);
                }
            }
        }

        function downloadResult() {
            const canvas = document.getElementById('outputCanvas');
            const link = document.createElement('a');
            const ext = selectedAction === 'jpg' ? 'jpg' : 'png';
            const mime = selectedAction === 'jpg' ? 'image/jpeg' : 'image/png';
            link.download = `pixel-tools-result.${ext}`;
            link.href = canvas.toDataURL(mime);
            link.click();
        }
    </script>
</body>
</html>
