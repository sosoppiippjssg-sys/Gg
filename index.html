<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Tool</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: #0c1020;
      color: #f3f5ff;
      font-family: system-ui, Tahoma, sans-serif;
    }

    .app { max-width: 850px; margin: auto; }

    header { margin-bottom: 18px; }
    h1 { margin: 0; font-size: 28px; }
    h1 span { color: #42d8c2; }
    header p, .hint { color: #aab3cc; }

    .box {
      background: #151b2e;
      border: 1px solid #29314b;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button, select, input {
      font: inherit;
      border-radius: 9px;
    }

    .tool, .action {
      border: 0;
      padding: 12px;
      color: white;
      cursor: pointer;
    }

    .tool { background: #222b44; }
    .tool.active, .action { background: #806fff; }
    button:disabled { opacity: .55; cursor: wait; }

    .upload {
      display: block;
      padding: 25px 12px;
      margin-top: 14px;
      border: 1px dashed #657191;
      border-radius: 12px;
      text-align: center;
      color: #aab3cc;
      cursor: pointer;
    }

    .upload strong { display: block; color: white; margin-bottom: 5px; }
    #file { display: none; }

    .controls {
      display: flex;
      align-items: end;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    label { display: grid; gap: 6px; color: #aab3cc; font-size: 14px; }

    input, select {
      min-height: 42px;
      padding: 8px;
      color: white;
      background: #101629;
      border: 1px solid #343e5d;
    }

    input[type="range"] { accent-color: #806fff; }

    #status {
      min-height: 24px;
      margin-top: 12px;
      color: #42d8c2;
      overflow-wrap: anywhere;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin: 15px auto 0;
      border-radius: 10px;
      background: #eee;
    }

    .hint { font-size: 12px; line-height: 1.7; }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .controls > * { flex: 1 1 130px; }
      .action { width: 100%; }
      .tool { font-size: 13px; padding: 10px 5px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>pixel <span>Tool</span></h1>
      <p>أدوات معالجة الصور</p>
    </header>

    <section class="box">
      <div class="tools">
        <button class="tool active" data-tool="remove">إزالة الخلفية</button>
        <button class="tool" data-tool="compress">ضغط الصورة</button>
        <button class="tool" data-tool="convert">تحويل الصيغة</button>
        <button class="tool" data-tool="crop">قص مربع أو دائري</button>
        <button class="tool" data-tool="watermark">علامة مائية</button>
      </div>

      <h2 id="title">إزالة الخلفية</h2>
      <p id="description" class="hint">اختر صورة لإزالة خلفيتها.</p>

      <label class="upload" for="file">
        <strong>اضغط لاختيار صورة</strong>
        PNG أو JPG أو WebP
      </label>
      <input id="file" type="file" accept="image/*">

      <div id="controls" class="controls"></div>
      <div id="status" aria-live="polite"></div>
      <img id="preview" alt="معاينة الصورة">
      <p class="hint">
        إزالة الخلفية تحتاج اتصالًا بالإنترنت لتحميل النموذج، وقد لا تعمل على كل الهواتف.
      </p>
    </section>
  </main>

  <script type="module">
    const $ = selector => document.querySelector(selector);

    const descriptions = {
      remove: ["إزالة الخلفية", "اختر صورة لإزالة خلفيتها."],
      compress: ["ضغط الصورة", "اختر جودة الصورة وعرضها الأقصى."],
      convert: ["تحويل الصيغة", "حوّل الصورة إلى PNG أو JPEG أو WebP."],
      crop: ["قص الصورة", "قص الصورة إلى مربع أو دائرة."],
      watermark: ["علامة مائية", "أضف نصًا إلى الصورة."]
    };

    let tool = "remove";
    let file = null;
    let previewURL = null;

    function setStatus(text) {
      $("#status").textContent = text;
    }

    document.querySelectorAll(".tool").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelector(".tool.active")?.classList.remove("active");
        button.classList.add("active");
        tool = button.dataset.tool;
        $("#title").textContent = descriptions[tool][0];
        $("#description").textContent = descriptions[tool][1];
        setStatus("");
        drawControls();
      });
    });

    $("#file").addEventListener("change", event => {
      const chosen = event.target.files?.[0];
      if (!chosen) return;

      if (!chosen.type.startsWith("image/")) {
        setStatus("اختر ملف صورة صالحًا.");
        return;
      }

      file = chosen;
      if (previewURL) URL.revokeObjectURL(previewURL);
      previewURL = URL.createObjectURL(file);
      $("#preview").src = previewURL;
      $("#preview").style.display = "block";
      setStatus("تم اختيار الصورة: " + file.name);
    });

    function drawControls() {
      const run = `<button class="action" id="run">تنفيذ وتنزيل</button>`;

      if (tool === "compress") {
        $("#controls").innerHTML = `
          <label>الجودة: <span id="qualityValue">75%</span>
            <input id="quality" type="range" min="10" max="100" value="75">
          </label>
          <label>أقصى عرض بالبكسل
            <input id="width" type="number" min="100" value="1600">
          </label>${run}`;

        $("#quality").addEventListener("input", event => {
          $("#qualityValue").textContent = event.target.value + "%";
        });
      } else if (tool === "convert") {
        $("#controls").innerHTML = `
          <label>الصيغة
            <select id="format">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
            </select>
          </label>${run}`;
      } else if (tool === "crop") {
        $("#controls").innerHTML = `
          <label>شكل القص
            <select id="shape">
              <option value="square">مربع</option>
              <option value="circle">دائري</option>
            </select>
          </label>${run}`;
      } else if (tool === "watermark") {
        $("#controls").innerHTML = `
          <label>نص العلامة المائية
            <input id="watermark" type="text" placeholder="Pixel Tool">
          </label>
          <label>حجم النص
            <select id="fontSize">
              <option value="24">صغير</option>
              <option value="40" selected>متوسط</option>
              <option value="64">كبير</option>
            </select>
          </label>${run}`;
      } else {
        $("#controls").innerHTML = run;
      }

      $("#run").addEventListener("click", processImage);
    }

    function loadImage(source) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(source);
        const image = new Image();

        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("تعذّر فتح الصورة."));
        };

        image.src = url;
      });
    }

    function toBlob(canvas, type, quality) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    function download(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    async function removeBackground() {
      setStatus("جارٍ تصغير الصورة لتخفيف الحمل على الهاتف…");

      const image = await loadImage(file);
      const maxSide = 900;
      const scale = Math.min(
        1,
        maxSide / Math.max(image.naturalWidth, image.naturalHeight)
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);

      const smallerFile = await toBlob(canvas, "image/jpeg", 0.8);
      if (!smallerFile) throw new Error("تعذّر تجهيز الصورة.");

      setStatus("جارٍ تحميل أداة إزالة الخلفية. قد يستغرق ذلك وقتًا أول مرة…");

      const { removeBackground } =
        await import("https://esm.sh/@imgly/background-removal");

      const result = await removeBackground(smallerFile, {
        progress: (key, current, total) => {
          if (total > 0) {
            const percent = Math.round((current / total) * 100);
            setStatus(`تحميل جزء من النموذج: ${percent}%`);
          } else {
            setStatus("جارٍ معالجة الصورة…");
          }
        }
      });

      if (previewURL) URL.revokeObjectURL(previewURL);
      previewURL = URL.createObjectURL(result);
      $("#preview").src = previewURL;

      download(result, "pixel-tool-background-removed.png");
      setStatus("اكتملت إزالة الخلفية.");
    }

    async function processImage() {
      if (!file) {
        setStatus("اختر صورة أولًا.");
        return;
      }

      const button = $("#run");
      button.disabled = true;

      try {
        if (tool === "remove") {
          await removeBackground();
          return;
        }

        setStatus("جارٍ معالجة الصورة…");
        const image = await loadImage(file);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        let type = "image/png";
        let quality = 0.9;

        if (tool === "compress") {
          const maxWidth = Math.max(100, Number($("#width").value) || 1600);
          const scale = Math.min(1, maxWidth / image.naturalWidth);
          canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
          type = "image/jpeg";
          quality = Number($("#quality").value) / 100;
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        }

        if (tool === "convert") {
          type = $("#format").value;
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;

          if (type === "image/jpeg") {
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }

          ctx.drawImage(image, 0, 0);
        }

        if (tool === "crop") {
          const side = Math.min(image.naturalWidth, image.naturalHeight);
          canvas.width = side;
          canvas.height = side;

          if ($("#shape").value === "circle") {
            ctx.beginPath();
            ctx.arc(side / 2, side / 2, side / 2, 0, Math.PI * 2);
            ctx.clip();
          }

          ctx.drawImage(
            image,
            (image.naturalWidth - side) / 2,
            (image.naturalHeight - side) / 2,
            side,
            side,
            0, 0, side, side
          );
        }

        if (tool === "watermark") {
          const text = $("#watermark").value.trim();
          if (!text) throw new Error("اكتب نص العلامة المائية.");

          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          ctx.drawImage(image, 0, 0);

          const size = Number($("#fontSize").value);
          ctx.font = `bold ${size}px sans-serif`;
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.lineWidth = Math.max(2, size / 12);
          ctx.strokeStyle = "rgba(0,0,0,.7)";
          ctx.fillStyle = "white";

          const x = 20;
          const y = canvas.height - 20;
          ctx.strokeText(text, x, y);
          ctx.fillText(text, x, y);
        }

        const result = await toBlob(canvas, type, quality);
        if (!result) throw new Error("تعذّر إنشاء الصورة.");

        const extension = type.split("/")[1].replace("jpeg", "jpg");
        download(result, `pixel-tool.${extension}`);
        setStatus(`اكتمل العمل. حجم الملف الناتج ${(result.size / 1024).toFixed(1)} كيلوبايت.`);
      } catch (error) {
        console.error(error);
        setStatus(error.message || "تعذّرت المعالجة. جرّب صورة أصغر أو أعد المحاولة.");
      } finally {
        button.disabled = false;
      }
    }

    drawControls();
  </script>
</body>
</html>
