<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Pixel Tool: أدوات صور مجانية تعمل في المتصفح: إزالة الخلفية، ضغط الصور، تحويل الصيغ، القص، والعلامة المائية.">
<title>Pixel Tool – أدوات الصور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#1c1a2e;--mut:#6b6882;--ac:#6c5ce7;--ac2:#00b894;--bd:#e4e1f2;--ok:#0a9a6d;--bad:#d63c3c;--k1:#d9d6e8;--k2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111c;--card:#1b1a2a;--tx:#f0eefc;--mut:#9a97b3;--ac:#8b7dff;--bd:#2d2b44;--ok:#35d6a2;--bad:#ff7a7a;--k1:#2a2840;--k2:#35335040}}
:root[data-theme="dark"]{--bg:#12111c;--card:#1b1a2a;--tx:#f0eefc;--mut:#9a97b3;--ac:#8b7dff;--bd:#2d2b44;--ok:#35d6a2;--bad:#ff7a7a;--k1:#2a2840;--k2:#35335040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,Tahoma,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:38px;height:38px}
.logo i{border-radius:3px;background:var(--ac)}.logo i:nth-child(2){background:var(--ac2)}.logo i:nth-child(3){opacity:.45}
h1{margin:0;font-size:26px;letter-spacing:.3px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px Cairo,Tahoma,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
