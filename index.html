<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Tools - استوديو الصور الذكي</title>
    <meta name="description" content="مجموعة أدوات متكاملة لمعالجة الصور محلياً داخل المتصفح: إزالة الخلفية، ضغط الحجم، تحويل الصيغ، والقص." />
    
    <!-- كود إثبات ملكية Google Search Console -->
    <meta name="google-site-verification" content="Md2tc493Laa5qpvwHf5J_AsHgpDsAb6NYVPiDnurBbA" />

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-600 selection:text-white">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-black text-xl shadow-lg shadow-indigo-500/30">PT</div>
                <span class="text-xl font-black tracking-wide bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">Pixel Tools</span>
            </div>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">معالجة فورية ومباشرة</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-10 w-full">
        <div class="text-center space-y-4 mb-8">
            <h1 class="text-3xl sm:text-4xl font-black tracking-tight">أدوات تعديل الصور السريعة</h1>
            <p class="text-slate-400 text-sm">اختر صورتك واستخدم الأدوات التفاعلية بالأسفل مباشرة</p>
        </div>

        <!-- Upload Box -->
        <div class="bg-slate-900/80 border-2 border-dashed border-slate-700 hover:border-indigo-500 transition-all rounded-3xl p-8 text-center cursor-pointer mb-8" onclick="document.getElementById('imageInput').click()">
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
            <div class="space-y-3">
                <div class="w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">📷</div>
                <p class="text-base font-bold text-slate-200">اضغط هنا لاختيار صورة من جهازك</p>
                <p class="text-xs text-slate-500">يدعم صيغ PNG, JPG, WEBP</p>
            </div>
        </div>

        <!-- Editor Dashboard (Hidden by default) -->
        <div id="editorSection" class="hidden space-y-6">
            <!-- Preview Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/60 p-6 border border-slate-800 rounded-3xl">
                <div class="space-y-2 text-center">
                    <span class="text-xs text-slate-400 font-bold">الصورة الأصلية</span>
                    <div class="bg-slate-950 p-2 rounded-2xl border border-slate-800 h-64 flex items-center justify-center overflow-hidden">
                        <img id="originalPreview" class="max-h-full max-w-full object-contain rounded-xl" />
                    </div>
                </div>
                <div class="space-y-2 text-center">
                    <span class="text-xs text-indigo-400 font-bold">النتيجة المعدلة</span>
                    <div class="bg-slate-950 p-2 rounded-2xl border border-slate-800 h-64 flex items-center justify-center overflow-hidden relative">
                        <canvas id="outputCanvas" class="max-h-full max-w-full object-contain rounded-xl hidden"></canvas>
                        <span id="placeholderText" class="text-xs text-slate-600">اختر أداة من الأسفل لتطبيق التعديل</span>
                    </div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button onclick="processFormat('image/png')" class="bg-slate-900 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl text-xs font-bold transition-all">تحويل إلى PNG</button>
                <button onclick="processFormat('image/jpeg')" class="bg-slate-900 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl text-xs font-bold transition-all">تحويل إلى JPG</button>
                <button onclick="processResize()" class="bg-slate-900 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl text-xs font-bold transition-all">ضغط الحجم (50%)</button>
                <button onclick="processGrayscale()" class="bg-slate-900 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 p-3 rounded-2xl text-xs font-bold transition-all">تحويل أبيض وأسود</button>
            </div>

            <!-- Download Button -->
            <div class="text-center pt-4">
                <button id="downloadBtn" onclick="downloadResult()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm px-8 py-3 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all">تحميل الصورة المعدلة ⬇️</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 Pixel Tools. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- Interactive Logic Script -->
    <script>
        let currentImage = new Image();

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage.src = e.target.result;
                currentImage.onload = function() {
                    document.getElementById('originalPreview').src = e.target.result;
                    document.getElementById('editorSection').classList.remove('hidden');
                }
            }
            reader.readAsDataURL(file);
        }

        function getCanvas() {
            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = currentImage.width;
            canvas.height = currentImage.height;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return { canvas, ctx };
        }

        function showResult() {
            document.getElementById('outputCanvas').classList.remove('hidden');
            document.getElementById('placeholderText').classList.add('hidden');
            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        function processFormat(mimeType) {
            const { canvas, ctx } = getCanvas();
            ctx.drawImage(currentImage, 0, 0);
            showResult();
        }

        function processResize() {
            const canvas = document.getElementById('outputCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = currentImage.width * 0.5;
            canvas.height = currentImage.height * 0.5;
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            showResult();
        }

        function processGrayscale() {
            const { canvas, ctx } = getCanvas();
            ctx.drawImage(currentImage, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                data[i] = avg;
                data[i + 1] = avg;
                data[i + 2] = avg;
            }
            ctx.putImageData(imgData, 0, 0);
            showResult();
        }

        function downloadResult() {
            const canvas = document.getElementById('outputCanvas');
            const link = document.createElement('a');
            link.download = 'pixel-tools-edited.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
